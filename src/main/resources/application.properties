spring.application.name=shopping-cart
server.port=8082
# SQL Server 連線
spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=shop;encrypt=true;trustServerCertificate=true
spring.datasource.username=test
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate 設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# JWT  1 秒 = 1000 毫秒，openssl rand -base64 48
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000